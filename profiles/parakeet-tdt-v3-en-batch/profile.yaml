# NVIDIA Parakeet-TDT-0.6b-v3 (via transformers, no nemo_toolkit) --
# EN batch. One multilingual checkpoint
# (Granary-trained, 25 European languages) rather than a per-language
# model swap -- same shape as parakeet-tdt-v3-nl-batch. Validated
# against schemas/benchmark-profile.schema.json.
id: parakeet-tdt-v3-en-batch
version: 1.0.0
title: Parakeet TDT 0.6b v3 EN (Batch)
benchmark_type: batch
language: en-US
runtime:
  name: parakeet
  min_version: 5.9.0
model:
  name: parakeet-tdt-0.6b-v3
configuration:
  threads: 4
normalization:
  lowercase: true
  remove_punctuation: true
  expand_numbers: true
  ruleset_id: goesb-en-v1
scoring:
  primary_metric: wer
  tie_breakers:
  - real_time_factor
  - energy_wh
metrics:
- wer
- cer
- real_time_factor
- cpu_pct
- ram_mb
- energy_wh
- temperature_c
overridable:
  threads:
    range:
      min: 1
      max: 16
changelog:
- version: 1.0.0
  notes: Initial profile.
