# Example official profile — English streaming. Same runtime/model as
# whisper-medium-en-batch; benchmark_type + configuration.chunk_ms + streaming
# metric set differ. Validated against schemas/benchmark-profile.schema.json.
#
# Performance note (2026-08-03): faster-whisper has no incremental
# decoder state, so streaming here means bounded-window local-agreement
# re-decode (see adapters/faster_whisper.py's run_streaming for the
# real-audio-validated design). Measured RTF ~2.5x on an Apple M1 Pro
# CPU — not realtime-capable on THAT hardware/backend, but that's a
# property of this one machine, not of the profile: GOESB is
# hardware-generic (docs/00-vision.md), so this stays a full wizard
# citizen — `--backend cuda` on real NVIDIA hardware, or a faster CPU,
# may well change the answer, and that's exactly what the benchmark
# should measure and show, not hide.
id: whisper-medium-en-streaming
version: 1.1.0
title: Whisper Medium English (Streaming)
benchmark_type: streaming
language: en-US
runtime:
  name: faster-whisper
  min_version: 1.0.0
model:
  name: whisper-medium
  quantization: int8
  beam_size: 5
  temperature: 0.0
  vad: true
configuration:
  threads: 4
  chunk_ms: 1000
normalization:
  lowercase: true
  remove_punctuation: true
  expand_numbers: true
  ruleset_id: goesb-en-v1
scoring:
  primary_metric: first_partial_latency
  tie_breakers:
  - streaming_responsiveness
  - real_time_factor
metrics:
- wer
- real_time_factor
- cpu_pct
- ram_mb
- first_partial_latency
- first_final_latency
- end_of_speech_latency
- update_frequency
- partial_stability
- streaming_responsiveness
overridable:
  beam_size:
    allowed:
    - 1
    - 2
    - 4
    - 5
    - 8
  vad: {}
  quantization:
    allowed:
    - int8
    - float32
  threads:
    range:
      min: 1
      max: 16
  chunk_ms:
    allowed:
    - 250
    - 500
    - 1000
    - 2000
changelog:
- version: 1.0.0
  notes: Initial streaming profile (M5).
- version: 1.1.0
  notes: Declare beam_size/chunk_ms/quantization/threads/vad override-eligible (ADR-0009).
