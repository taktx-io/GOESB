id: whispercpp-medium-fr-batch
version: 1.1.2
title: Whisper.cpp Medium FR (Batch)
benchmark_type: batch
language: fr-FR
runtime:
  name: whisper-cpp
  min_version: 1.5.0
model:
  name: whisper-medium
  beam_size: 5
  temperature: 0.0
  vad: false
  context_reset: per_utterance
configuration:
  threads: 4
normalization:
  lowercase: true
  remove_punctuation: true
  expand_numbers: true
  ruleset_id: goesb-fr-v1
scoring:
  primary_metric: wer
  tie_breakers:
  - real_time_factor
  - energy_wh
metrics:
- wer
- wer_substitutions
- wer_deletions
- wer_insertions
- cer
- cer_substitutions
- cer_deletions
- cer_insertions
- real_time_factor
- cpu_pct
- ram_mb
- energy_wh
- temperature_c
overridable:
  threads:
    range:
      min: 1
      max: 16
changelog:
- version: 1.0.0
  notes: Initial profile (bulk-generated official set).
- version: 1.1.0
  notes: Declare threads override-eligible (ADR-0009).
- version: 1.1.1
  notes: Declare wer/cer substitution/deletion/insertion breakdown metrics, now that the runner computes them.
- version: 1.1.2
  notes: Declare model.vad (false -- this adapter never applies it) and model.context_reset (per_utterance -- the adapter now always passes no_context=True explicitly) so a reader never has to infer these from adapter code.
