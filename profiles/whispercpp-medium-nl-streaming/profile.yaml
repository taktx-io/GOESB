id: whispercpp-medium-nl-streaming
version: 1.0.2
title: Whisper.cpp Medium NL (Streaming)
benchmark_type: streaming
language: nl-NL
runtime:
  name: whisper-cpp
  min_version: 1.5.0
model:
  name: whisper-medium
  beam_size: 5
  temperature: 0.0
  vad: false
  context_reset: per_utterance
configuration:
  threads: 4
  chunk_ms: 1000
normalization:
  lowercase: true
  remove_punctuation: true
  expand_numbers: true
  ruleset_id: goesb-nl-v1
scoring:
  primary_metric: first_partial_latency
  tie_breakers:
  - streaming_responsiveness
  - real_time_factor
metrics:
- wer
- wer_substitutions
- wer_deletions
- wer_insertions
- real_time_factor
- cpu_pct
- ram_mb
- first_partial_latency
- first_final_latency
- end_of_speech_latency
- update_frequency
- partial_stability
- streaming_responsiveness
overridable:
  threads:
    range:
      min: 1
      max: 16
  chunk_ms:
    allowed:
    - 250
    - 500
    - 1000
    - 2000
changelog:
- version: 1.0.0
  notes: Initial profile (bulk-generated streaming set, matching batch's language/engine/size
    coverage).
- version: 1.0.1
  notes: Declare wer/cer substitution/deletion/insertion breakdown metrics, now that the runner computes them.
- version: 1.0.2
  notes: Declare model.vad (false -- this adapter never applies it) and model.context_reset (per_utterance -- the adapter now always passes no_context=True explicitly) so a reader never has to infer these from adapter code.
