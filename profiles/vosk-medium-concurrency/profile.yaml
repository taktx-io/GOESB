# Concurrency/load profile (ADR-0012): does this hardware stay fast under N
# simultaneous requests, not just one at a time? No `language` -- this
# doesn't score transcription accuracy, only performance under load, so
# which model *language* backs it has no bearing on the answer (unlike
# batch, where vosk's per-language models make a language axis
# unavoidable). English is picked arbitrarily as the one representative
# model for this size tier -- matches every other concurrency profile's
# naming (`whisper-medium-concurrency`, not one per language) and this
# codebase's existing "prefer librispeech-en when present" default
# elsewhere (`_wizard_run_concurrency`'s filler-pack choice). vosk's Kaldi
# decoder has no equivalent tunables to beam_size/quantization/etc (see
# the batch profile's own note) -- only concurrency is a real, effective
# parameter here. One full vosk.Model instance per worker, not a shared
# model -- see run_concurrency's own docstring for why (a real, documented
# vosk-api thread-safety concern, not a theoretical one).
id: vosk-medium-concurrency
version: 1.0.0
title: Vosk Medium (Concurrency)
benchmark_type: concurrency
runtime:
  name: vosk
  min_version: 0.3.44
model:
  name: vosk-model-en-us-0.22
configuration:
  threads: 4
  concurrency: 1
  duration_s: 30
scoring:
  primary_metric: real_time_factor
  tie_breakers:
  - throughput
  - energy_wh
metrics:
- real_time_factor
- throughput
- cpu_pct
- ram_mb
- energy_wh
- temperature_c
overridable:
  concurrency:
    range:
      min: 1
      max: 8
changelog:
- version: 1.0.0
  notes: Initial profile (ADR-0012 vosk support) -- not split per language, unlike vosk's batch profiles.
