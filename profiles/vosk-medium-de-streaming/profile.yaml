id: vosk-medium-de-streaming
version: 1.0.2
title: Vosk Medium DE (Streaming)
benchmark_type: streaming
language: de-DE
runtime:
  name: vosk
  min_version: 0.3.44
model:
  name: vosk-model-de-0.21
  vad: false
  context_reset: per_utterance
configuration:
  threads: 4
  chunk_ms: 1000
normalization:
  lowercase: true
  remove_punctuation: true
  expand_numbers: true
  ruleset_id: goesb-de-v1
scoring:
  primary_metric: first_partial_latency
  tie_breakers:
  - streaming_responsiveness
  - real_time_factor
metrics:
- wer
- wer_substitutions
- wer_deletions
- wer_insertions
- real_time_factor
- cpu_pct
- ram_mb
- first_partial_latency
- first_final_latency
- end_of_speech_latency
- update_frequency
- partial_stability
- streaming_responsiveness
overridable:
  chunk_ms:
    allowed:
    - 250
    - 500
    - 1000
    - 2000
changelog:
- version: 1.0.0
  notes: Initial profile (bulk-generated streaming set, matching batch's language/engine/size
    coverage).
- version: 1.0.1
  notes: Declare wer/cer substitution/deletion/insertion breakdown metrics, now that the runner computes them.
- version: 1.0.2
  notes: Declare model.vad (false -- this adapter never applies it) and model.context_reset (per_utterance -- the adapter constructs a fresh KaldiRecognizer per utterance, no shared decode state to carry across calls in the first place) so a reader never has to infer these from adapter code.
