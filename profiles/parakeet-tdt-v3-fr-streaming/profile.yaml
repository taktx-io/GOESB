# NVIDIA Parakeet-TDT-0.6b-v3 (via transformers, no nemo_toolkit) --
# FR streaming. Same bounded-window
# re-decode approach as the Whisper-family streaming profiles (see
# runner/src/oesb_runner/adapters/parakeet.py's run_streaming docstring
# for why this engine has no genuine incremental path through
# transformers). Validated against schemas/benchmark-profile.schema.json.
id: parakeet-tdt-v3-fr-streaming
version: 1.0.2
title: Parakeet TDT 0.6b v3 FR (Streaming)
benchmark_type: streaming
language: fr-FR
runtime:
  name: parakeet
  min_version: 5.9.0
model:
  name: parakeet-tdt-0.6b-v3
  vad: false
  context_reset: per_utterance
configuration:
  threads: 4
  chunk_ms: 1000
normalization:
  lowercase: true
  remove_punctuation: true
  expand_numbers: true
  ruleset_id: goesb-fr-v1
scoring:
  primary_metric: first_partial_latency
  tie_breakers:
  - streaming_responsiveness
  - real_time_factor
metrics:
- wer
- wer_substitutions
- wer_deletions
- wer_insertions
- real_time_factor
- cpu_pct
- ram_mb
- first_partial_latency
- first_final_latency
- end_of_speech_latency
- update_frequency
- partial_stability
- streaming_responsiveness
overridable:
  threads:
    range:
      min: 1
      max: 16
  chunk_ms:
    allowed:
    - 250
    - 500
    - 1000
    - 2000
changelog:
- version: 1.0.0
  notes: Initial profile.
- version: 1.0.1
  notes: Declare wer/cer substitution/deletion/insertion breakdown metrics, now that the runner computes them.
- version: 1.0.2
  notes: Declare model.vad (false -- this adapter never applies it) and model.context_reset (per_utterance -- ParakeetRNNTGenerationMixin.generate() resets its own decode state fresh at the top of every call, confirmed by reading generation_parakeet.py) so a reader never has to infer these from adapter code.
