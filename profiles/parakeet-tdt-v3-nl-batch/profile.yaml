# NVIDIA Parakeet-TDT-0.6b-v3 (via transformers, no nemo_toolkit) — Dutch
# batch. One multilingual checkpoint (Granary-trained, 25 European
# languages incl. Dutch) rather than a per-language model swap. Validated
# against schemas/benchmark-profile.schema.json.
id: parakeet-tdt-v3-nl-batch
version: 1.0.2
title: Parakeet TDT 0.6b v3 Dutch (Batch)
benchmark_type: batch
language: nl-NL
runtime:
  name: parakeet
  min_version: 5.9.0
model:
  name: parakeet-tdt-0.6b-v3
  vad: false
  context_reset: per_utterance
configuration:
  threads: 4
normalization:
  lowercase: true
  remove_punctuation: true
  expand_numbers: true
  ruleset_id: goesb-nl-v1
scoring:
  primary_metric: wer
  tie_breakers:
  - real_time_factor
  - energy_wh
metrics:
- wer
- wer_substitutions
- wer_deletions
- wer_insertions
- cer
- cer_substitutions
- cer_deletions
- cer_insertions
- real_time_factor
- cpu_pct
- ram_mb
- energy_wh
- temperature_c
overridable:
  threads:
    range:
      min: 1
      max: 16
changelog:
- version: 1.0.0
  notes: Initial profile.
- version: 1.0.1
  notes: Declare wer/cer substitution/deletion/insertion breakdown metrics, now that the runner computes them.
- version: 1.0.2
  notes: Declare model.vad (false -- this adapter never applies it) and model.context_reset (per_utterance -- ParakeetRNNTGenerationMixin.generate() resets its own decode state fresh at the top of every call, confirmed by reading generation_parakeet.py) so a reader never has to infer these from adapter code.
