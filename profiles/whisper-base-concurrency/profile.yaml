# Concurrency/load profile (ADR-0012): does this hardware stay fast under N
# simultaneous requests, not just one at a time? No `language`, no
# `normalization`, no wer/cer -- this doesn't score transcription accuracy,
# only performance under concurrent load, so any open pack's audio works as
# filler content (see ADR-0012 for why this reuses packs rather than
# bypassing them). `--param concurrency=1,4,8,16` sweeps the levels; each is
# its own signed result, same ADR-0009 sweep mechanism batch profiles use
# for beam_size.
id: whisper-base-concurrency
version: 1.0.0
title: Whisper Base (Concurrency)
benchmark_type: concurrency
runtime:
  name: faster-whisper
  min_version: 1.0.0
model:
  name: whisper-base
  quantization: int8
  beam_size: 5
  temperature: 0.0
  vad: true
configuration:
  threads: 4
  concurrency: 1
  duration_s: 30
scoring:
  primary_metric: real_time_factor
  tie_breakers:
  - throughput
  - gpu_pct
metrics:
- real_time_factor
- throughput
- cpu_pct
- ram_mb
- gpu_pct
- energy_wh
- temperature_c
overridable:
  concurrency:
    range:
      min: 1
      max: 64
  beam_size:
    allowed:
    - 1
    - 2
    - 4
    - 5
    - 8
  vad: {}
  quantization:
    allowed:
    - int8
    - float32
  threads:
    range:
      min: 1
      max: 16
changelog:
- version: 1.0.0
  notes: Initial profile (ADR-0012).
