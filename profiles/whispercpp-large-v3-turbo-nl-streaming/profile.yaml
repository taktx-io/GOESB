id: whispercpp-large-v3-turbo-nl-streaming
version: 1.0.0
title: Whisper.cpp Large V3 Turbo NL (Streaming)
benchmark_type: streaming
language: nl-NL
runtime:
  name: whisper-cpp
  min_version: 1.5.0
model:
  name: whisper-large-v3-turbo
  beam_size: 5
  temperature: 0.0
  vad: false
  context_reset: per_utterance
configuration:
  threads: 4
  chunk_ms: 1000
normalization:
  lowercase: true
  remove_punctuation: true
  expand_numbers: true
  ruleset_id: goesb-nl-v1
scoring:
  primary_metric: first_partial_latency
  tie_breakers:
  - streaming_responsiveness
  - real_time_factor
metrics:
- wer
- wer_substitutions
- wer_deletions
- wer_insertions
- real_time_factor
- cpu_pct
- ram_mb
- first_partial_latency
- first_final_latency
- end_of_speech_latency
- update_frequency
- partial_stability
- streaming_responsiveness
overridable:
  threads:
    range:
      min: 1
      max: 16
  chunk_ms:
    allowed:
    - 250
    - 500
    - 1000
    - 2000
changelog:
- version: 1.0.0
  notes: New profile for whisper-large-v3-turbo. Mirrors its whisper-large-v3 sibling field-for-field (turbo is the same encoder with a pruned 4-layer decoder -- no config-surface change) -- added per external feedback (2026-08-05 Babbl letter). Verified real support first, not assumed -- whisper.cpp's official ggml-large-v3-turbo.bin (download-ggml-model.sh large-v3-turbo) and faster-whisper's own _MODELS mapping ("large-v3-turbo"/"turbo" both resolve to mobiuslabsgmbh/faster-whisper-large-v3-turbo, confirmed by reading faster_whisper/utils.py directly).
