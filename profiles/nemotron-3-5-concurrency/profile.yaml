# Concurrency/load profile (ADR-0012) for NVIDIA Nemotron 3.5 ASR
# streaming 0.6b: does this GPU stay fast under N simultaneous requests,
# not just one at a time? No `language`, no `normalization`, no wer/cer --
# this doesn't score transcription accuracy, only performance under
# concurrent load, so any open pack's audio works as filler content.
# `--param concurrency=1,2,4,8` sweeps the levels; each is its own signed
# result, same ADR-0009 sweep mechanism batch profiles use.
#
# GPU-only (ADR-0013 §4): `--backend cpu` is a hard error here.
#
# Nemotron needs one full model instance PER worker -- transformers'
# generate() overrides for this model keep per-call state on the instance
# and even rebind `self.get_audio_features` mid-call, so two concurrent
# calls on one instance race and cross-contaminate language conditioning
# (see runner/src/oesb_runner/adapters/nemotron.py's run_concurrency
# docstring).
#
# `concurrency`'s ceiling is 8. Measured on a real NVIDIA RTX A6000
# (48 GB), not extrapolated: one loaded+warmed instance consumes ~2.67 GB
# of device memory, and peak VRAM across a whole timed window was 3.2 GiB
# at concurrency 1, 5.6 GiB at 2, 10.5 GiB at 4 and 20.3 GiB at 8 -- so 8
# workers fit comfortably on a 24 GB card. VRAM is NOT what makes 8 the
# ceiling.
#
# What does: throughput peaks at concurrency 2 and then collapses.
# Measured twice, independently, same box -- ~36-41 audio-s/s at 1,
# ~50 at 2, then ~21 at 3, ~20 at 4, ~18-21 at 8. The cliff between 2 and
# 3 is reproducible and is NOT CPU-thread contention: re-running 2/3/8 at
# `threads=1` and `threads=4` moved throughput by less than the ~11-15%
# run-to-run noise, and cpu_pct sat at ~150-190% throughout either way.
# It is GPU-side -- N independent model instances contend for the same
# SMs with no cross-request batching to amortise it. The ceiling of 8 is
# therefore set to keep the *interesting* part of the curve sweepable
# (`--param concurrency=1,2,4,8` shows the peak AND the collapse), not to
# suggest 8 is a useful operating point. On this engine it is not.
id: nemotron-3-5-concurrency
version: 1.0.0
title: Nemotron 3.5 ASR Streaming 0.6b (Concurrency)
benchmark_type: concurrency
runtime:
  name: nemotron
  min_version: 5.13.0
model:
  name: nemotron-3.5-asr-streaming-0.6b
configuration:
  threads: 4
  concurrency: 1
  duration_s: 30
scoring:
  primary_metric: real_time_factor
  tie_breakers:
  - throughput
  - gpu_pct
metrics:
- real_time_factor
- throughput
- cpu_pct
- ram_mb
- gpu_pct
- energy_wh
- temperature_c
overridable:
  concurrency:
    range:
      min: 1
      max: 8
  threads:
    range:
      min: 1
      max: 16
changelog:
- version: 1.0.0
  notes: Initial profile (ADR-0012 shape, ADR-0013 engine). concurrency ceiling 8 set from measured per-instance VRAM, not copied from another engine.
