# Example official profile — English batch. Identical structure to the Dutch
# profile; only language and normalization ruleset differ. Validated against
# schemas/benchmark-profile.schema.json.
id: whisper-medium-en-batch
version: 1.1.2
title: Whisper Medium English (Batch)
benchmark_type: batch
language: en-US
runtime:
  name: faster-whisper
  min_version: 1.0.0
model:
  name: whisper-medium
  quantization: int8
  beam_size: 5
  temperature: 0.0
  vad: true
  context_reset: per_utterance
configuration:
  threads: 4
normalization:
  lowercase: true
  remove_punctuation: true
  expand_numbers: true
  ruleset_id: goesb-en-v1
scoring:
  primary_metric: wer
  tie_breakers:
  - real_time_factor
  - energy_wh
metrics:
- wer
- wer_substitutions
- wer_deletions
- wer_insertions
- cer
- cer_substitutions
- cer_deletions
- cer_insertions
- real_time_factor
- cpu_pct
- ram_mb
- energy_wh
- temperature_c
overridable:
  beam_size:
    allowed:
    - 1
    - 2
    - 4
    - 5
    - 8
  vad: {}
  quantization:
    allowed:
    - int8
    - float32
  threads:
    range:
      min: 1
      max: 16
changelog:
- version: 1.0.0
  notes: Initial profile.
- version: 1.0.1
  notes: Added temperature_c (M2) now that the hwmon probe exists.
- version: 1.1.0
  notes: Declare beam_size/quantization/threads/vad override-eligible (ADR-0009).
- version: 1.1.1
  notes: Declare wer/cer substitution/deletion/insertion breakdown metrics, now that the runner computes them.
- version: 1.1.2
  notes: Declare model.context_reset (per_utterance) explicitly -- confirmed empirically (not assumed) that this adapter's Python API already has no cross-utterance context-bleed risk; documents that fact instead of leaving it implicit.
