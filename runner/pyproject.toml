[project]
name = "goesb-runner"
version = "0.9.28"
description = "Official Open Edge Speech Benchmark (GOESB) runner"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
  "pydantic>=2.6",
  "typer>=0.12",
  "pyyaml>=6.0",
  "psutil>=5.9",
  "cryptography>=42.0",
  "jsonschema>=4.21",
  "packaging>=23.0",
  # Interactive wizard (bare `goesb` with no subcommand) — pure-Python
  # (prompt_toolkit), no native deps, so it's fine on every platform this
  # ships to including Raspberry Pi.
  "questionary>=2.0",
  # End-of-run metrics table. Pure-Python, no native deps -- same
  # every-platform-including-Raspberry-Pi bar as questionary above.
  "rich>=13.0",
]

[project.optional-dependencies]
# ruff pinned to a minor version, not left floating: an unpinned >=0.4 let
# CI silently pick up a newer ruff whose default rule set changed, breaking
# a previously-green build with no repo change at all.
dev = ["pytest>=8.0", "ruff~=0.16.0", "mypy>=1.9"]
# A pip-installable substitute for the cuBLAS shared library that
# `faster-whisper`'s ctranslate2 backend dlopen's at runtime for
# --backend cuda -- lets a fresh Ubuntu box (NVIDIA driver present, no
# system CUDA Toolkit, or one on the wrong major version) work without
# the multi-GB Toolkit installer. Linux only -- no wheel exists for
# macOS/Windows, and cuda_runtime.py only ever attempts this on Linux.
#
# nvidia-ml-py is NVIDIA's own official NVML binding (imports as `pynvml`)
# -- what gpu_pct.py reads utilization.gpu from instead of shelling out to
# nvidia-smi. Pure ctypes, no compiled wheel, works wherever the NVIDIA
# driver itself does (unlike cuBLAS above, not Linux-restricted).
cuda = ["nvidia-cublas-cu12>=12.0,<13; sys_platform == 'linux'", "nvidia-ml-py>=12.0"]
faster-whisper = ["faster-whisper>=1.0.0"]
vosk = ["vosk>=0.3.44", "soundfile>=0.12"]
whisper-cpp = ["pywhispercpp>=1.5.0", "soundfile>=0.12"]
# transformers' AutoModelForTDT/AutoProcessor (native Parakeet support, no
# nemo_toolkit needed -- confirmed via the transformers docs directly:
# nemo_toolkit['all'] pulls in a much heavier stack -- pytorch-lightning,
# hydra-core, onnx, etc. -- that this adapter never needs). Pinned to the
# release line that actually ships Parakeet model classes.
# `numpy<2.5` is not ours to want -- it is numba's, reached transitively
# (librosa imports numba at module scope, and transformers' feature
# extractors for both NVIDIA checkpoints call librosa.filters.mel). numba
# declares `numpy<2.5,>=1.22` correctly, so a clean resolve honours it --
# but an *incremental* install into an env that already has a newer numpy
# does not reliably downgrade it, and the result is a broken environment
# that only fails at first inference with `ImportError: Numba needs NumPy
# 2.4 or less`, thousands of frames deep. Real report from a pipx install.
# Stating it here makes the constraint visible to the resolver at our
# level. Drop it once numba supports numpy 2.5.
parakeet = ["transformers>=5.9", "torch>=2.2", "soundfile>=0.12", "librosa>=0.10", "numpy<2.5"]
# NVIDIA Nemotron 3.5 ASR streaming (ADR-0013), via transformers'
# AutoModelForRNNT/AutoProcessor -- same "no nemo_toolkit" reasoning as
# parakeet above. Pinned to >=5.13, the release line that actually ships the
# nemotron3_5_asr/nemotron_asr_streaming model classes; parakeet's own >=5.9
# stays where it is (the two extras overlap but each pins what it genuinely
# needs). GPU-only at run time (ADR-0013 §4) -- nothing here can express
# that, `--backend cpu` is refused by the adapter's declared backend set.
# Same transitive numba/numpy constraint as parakeet above.
nemotron = ["transformers>=5.13", "torch>=2.2", "soundfile>=0.12", "librosa>=0.10", "numpy<2.5"]
mozilla-data-collective = ["datacollective>=0.5.0"]

[project.scripts]
goesb = "oesb_runner.cli:app"

[tool.pytest.ini_options]
markers = ["slow: exercises a real model/network (e.g. faster-whisper inference)"]

[tool.ruff.lint.per-file-ignores]
# Adapters/rulesets import after a comment explaining the registration side effect;
# tests importorskip an optional dep before importing the module that needs it.
"src/oesb_runner/adapters/__init__.py" = ["E402"]
"src/oesb_runner/normalization/__init__.py" = ["E402"]
"tests/test_adapter_faster_whisper.py" = ["E402"]
"tests/test_adapter_nemotron.py" = ["E402"]
"tests/test_adapter_parakeet.py" = ["E402"]
"tests/test_adapter_vosk.py" = ["E402"]
"tests/test_adapter_whisper_cpp.py" = ["E402"]
"tests/test_audio.py" = ["E402"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oesb_runner"]
